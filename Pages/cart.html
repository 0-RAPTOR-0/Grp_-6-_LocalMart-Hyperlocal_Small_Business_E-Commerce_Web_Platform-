<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Local Mart</title>
  <link rel="stylesheet" href="../Css/style.css">
</head>
<body>

  <header class = "navbar">
    <div class = "brand">
      <a href = "../index.html" style = "color: #fff; text-decoration: none;">Local Mart</a>

    </div>
  </header>

  <div class = "page-header">Shopping Cart (3 items)</div>
  <div class = "container" style = "max-width: 700px;">

    <form action = "checkout.html" method = "post">

      <div class = "list-item">
        <div class = "thumb-sm">Rice</div>
        <div class = "info">
          <div class = "name">Premium Rice 5kg</div>
          <div class = "meta price">৳ 320</div>

        </div>

        <div class = "qty-control">
          <button type = "button" aria-label = "Decrease quantity">-</button>

          <input type = "number" name = "qty_1" value = "1" min = "1" style = "width: 44px; text-align: center;" title = " Quantity for Premium Rice 5kg"> 
          <button type = "button" aria-label = "Increase quantity">+</button>


        </div>
      </div>

      <div class = "list-item">
        <div class = "thumb-sm">Oil</div>
        <div class = "info">
          <div class = "name">Mustard Oil 1L</div>
          <div class = "meta price">৳ 180</div>

        </div>

        <div class = "qty-control">
          <button type = "button" aria-label = "Decrease quantity">-</button>

          <input type = "number" name = "qty_2" value = "2" min = "1" style = "width: 44px; text-align: center;" title = " Quantity for Mustard Oil 1L"> 
          <button type = "button" aria-label = "Increase quantity">+</button>
        
        </div>
      </div>

      <div class = "list-item">
        <div class = "thumb-sm">Spices</div>
        <div class = "info">
          <div class = "name">Mixed Spices Pack</div>
          <div class = "meta price">৳ 75</div>

        </div>

        <div class = "qty-control">
          <button type = "button" aria-label = "Decrease quantity">-</button>

          <input type = "number" name = "qty_3" value = "1" min = "1" style = "width: 44px; text-align: center;" title = " Quantity for Refined Sugar 2kg"> 
          <button type = "button" aria-label = "Increase quantity">+</button>
        
        </div>
      </div>

      <div class = "summary-box">
        <div class = "summary-row"><span>Subtotal</span><span>৳ 755</span></div>
        <div class = "summary-row"><span>Delivery</span><span>৳ 40</span></div>
        <div class = "summary-row total"><span>Total</span><span>৳ 795</span></div>

        </div>

        <button type = "submit" class = "btn btn-primary mt-20">Proceed to Checkout</button>

    </form>
  </div>

  <footer class="site-footer">Screen 7 — SHOPPING CART</footer>
  
</body>
</html>
