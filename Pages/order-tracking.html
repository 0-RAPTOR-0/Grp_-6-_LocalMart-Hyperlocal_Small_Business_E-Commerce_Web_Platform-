<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Tracking — LocalMart</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="navbar">
  <div class="brand"><a href="../index.html" style="color:#fff;">LocalMart</a></div>
</header>
<div class="page-header">Order Tracking — ORD-2841</div>

<div class="container" style="max-width:600px;">
  <div class="flex-between">
    <div class="meta">3 items • ৳ 795</div>
    <span class="badge badge-pending">Out for Delivery</span>
  </div>

  <div class="timeline mt-20">
    <div class="timeline-step">
      <div class="timeline-dot"></div>
      <div class="timeline-text">
        <div class="step-title">Order Placed</div>
        <div class="step-time">Today, 10:30 AM</div>
      </div>
    </div>
    <div class="timeline-step">
      <div class="timeline-dot"></div>
      <div class="timeline-text">
        <div class="step-title">Order Confirmed by Shop</div>
        <div class="step-time">Today, 10:45 AM</div>
      </div>
    </div>
    <div class="timeline-step">
      <div class="timeline-dot"></div>
      <div class="timeline-text">
        <div class="step-title">Picked Up by Agent</div>
        <div class="step-time">Today, 11:15 AM</div>
      </div>
    </div>
    <div class="timeline-step pending">
      <div class="timeline-dot"></div>
      <div class="timeline-text">
        <div class="step-title">Out for Delivery</div>
        <div class="step-time">In progress...</div>
      </div>
    </div>
    <div class="timeline-step future">
      <div class="timeline-dot"></div>
      <div class="timeline-text">
        <div class="step-title">Delivered</div>
        <div class="step-time">Expected: 12:30 PM</div>
      </div>
    </div>
  </div>

  <div class="summary-box">
    <strong>Delivery Agent</strong>
    <div class="meta mt-10">Md. Hasan • 01712-XXXXXX</div>
  </div>
</div>

<footer class="site-footer">SCREEN 9 — ORDER TRACKING</footer>

</body>
</html>
